<title>How to set up web launcher</title>
<h1>How to set up web launcher</h1>
Open web launcher (If it already asks you if you want to set up the roblox:// and the roblox-player:// handle, accept and skip the rest of the steps)
<p>Click the gear icon</p>
<p>Click "Protocol"</p>
<p>Click "Re-register handler"</p>
